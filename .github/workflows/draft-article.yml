
# Drafts the next article from the CLAUDE.md backlog as a pull request.
# Safeguards: (1) skips the run if an unreviewed draft PR is already open,
# (2) auto-blocks drafts containing compliance trigger language.
# Nothing publishes until a human merges.

name: Draft next article

on:
  schedule:
    - cron: "0 9 * * 1"  
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if an unreviewed draft is already open
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --state open --json title --jq '[.[] | select(.title | startswith("DRAFT for compliance review"))] | length')
          echo "open_drafts=$open" >> "$GITHUB_OUTPUT"
          if [ "$open" != "0" ]; then
            echo "A draft PR is already open and awaiting review - skipping this run to avoid duplicates."
          fi

      - name: Draft the article
        if: steps.guard.outputs.open_drafts == '0'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read CLAUDE.md in this repo. Write the next unwritten article from the
            "Article backlog" section, following every rule in "Non-negotiable
            compliance rules", "Voice and structure for articles", and the
            "When adding an article" checklist. Hard rules: never use the word "can";
            no em dashes; 900 to 1,200 words of article text; a Sources section;
            the approved legal block copied verbatim from CLAUDE.md. Use
            guides/chicago-condo-rules-august-2026.html as the exact
            structural template (byline, date line, body, FAQ, contact block,
            Sources section, then the approved legal block; no CTA block). Create the new article file inside the guides/
            directory. Update llms.txt, sitemap.xml, and index.html per the
            checklist, and mark the article done in the CLAUDE.md backlog.
            Also write the article's title as a single plain-text line into a new
            file named DRAFT_TITLE.txt in the repo root.
            IMPORTANT: Only create and edit files in the current working
            directory. Do NOT run any git commands, do NOT create branches, do
            NOT open a pull request. The workflow handles all of that.
          claude_args: '--max-turns 40 --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,LS"'

      - name: Compliance screen - block trigger language
        if: steps.guard.outputs.open_drafts == '0'
        run: |
          changed=$(git status --porcelain | awk '{print $2}' | grep -E '\.(html|md|txt)$' | grep -v 'CLAUDE.md' || true)
          if [ -z "$changed" ]; then echo "No changed files to screen."; exit 0; fi
          pattern='\bAPR\b|rates? as low as|lowest rate|best rate|best lender|best deal|lock in [0-9]|[0-9](\.[0-9]+)? ?% ?(APR|interest|rate)|(rate|APR) of [0-9]|guaranteed? (approval|savings|qualification)|no.?cost refinance|no closing costs|free money|#1 |number one|risk.?free|act now|limited time|apply instantly'
          hits=$(grep -inE "$pattern" $changed || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Compliance screen flagged the language above. Draft blocked - no PR was opened. Fix CLAUDE.md guidance or rerun."
            exit 1
          fi
          echo "Compliance screen passed - no trigger language found."

      - name: Hard rules for new article files
        if: steps.guard.outputs.open_drafts == '0'
        run: |
          new=$(git status --porcelain guides/ | awk '$1=="??" {print $2}' | grep '\.html$' || true)
          if [ -z "$new" ]; then echo "::error::No new article file found in guides/."; exit 1; fi
          fail=0
          for f in $new; do
            echo "Checking $f"
            body=$(python3 -c "import re,sys,html; s=open(sys.argv[1]).read(); m=re.search(r'</h1>(.*?)<h2>Sources</h2>',s,re.S); t=m.group(1) if m else ''; t=re.sub(r'<script.*?</script>','',t,flags=re.S); t=re.sub(r'<[^>]+>',' ',t); print(html.unescape(t))" "$f")
            if ! grep -q '<h2>Sources</h2>' "$f"; then echo "::error::$f is missing the <h2>Sources</h2> section."; fail=1; fi
            for must in "Equal Housing Lender." "All information provided in this publication is for informational and educational purposes only" "No mortgage loan applications for properties located in New York will be accepted through this site" "OriginPoint LLC, NMLS #2185899. Operating in the state of California as OriginPoint Mortgage LLC"; do
              grep -qF "$must" "$f" || { echo "::error::$f is missing approved legal block text: $must"; fail=1; }
            done
            hits=$(echo "$body" | grep -noiE "\bcan\b|\bcan't\b|\bcannot\b" || true)
            if [ -n "$hits" ]; then echo "$hits"; echo "::error::$f uses the word 'can' (banned by compliance)."; fail=1; fi
            if echo "$body" | grep -q '—'; then echo "::error::$f contains an em dash."; fail=1; fi
            words=$(echo "$body" | wc -w)
            echo "Article text word count: $words"
            if [ "$words" -gt 1300 ]; then echo "::error::$f is $words words; hard cap is 1300."; fail=1; fi
          done
          exit $fail

      - name: Read draft title
        id: meta
        if: steps.guard.outputs.open_drafts == '0'
        run: |
          if [ -f DRAFT_TITLE.txt ]; then
            echo "title=$(head -n 1 DRAFT_TITLE.txt)" >> "$GITHUB_OUTPUT"
            rm DRAFT_TITLE.txt
          else
            echo "title=New article draft" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request with the draft
        if: steps.guard.outputs.open_drafts == '0'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Draft article for compliance review"
          title: "DRAFT for compliance review: ${{ steps.meta.outputs.title }}"
          body: |
            Automated draft from the article backlog in CLAUDE.md.
            Passed the automated compliance language screen.
            Review, confirm compliance sign-off, then merge to publish.
          branch: draft/article
          branch-suffix: timestamp
          delete-branch: true
